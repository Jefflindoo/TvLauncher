name: Gerar APK do Jeff

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Extrair Projeto
      run: |
        unzip TvLauncher.zip -d projeto_extraido
        echo "Conteudo extraido:"
        ls -R projeto_extraido
      
    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Compilar APK
      run: |
        cd projeto_extraido/TvLauncher
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi
      
    - name: Enviar APK Pronto
      uses: actions/upload-artifact@v4
      with:
        name: Meu-APK-Pronto
        path: '**/build/outputs/apk/debug/*.apk'
