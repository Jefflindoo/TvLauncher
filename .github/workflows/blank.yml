name: "Ultra Advanced APK Compiler - Multi-Java"

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "24"
  NODE_NO_WARNINGS: "1"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.logging.level=lifecycle"

jobs:
  android-build-pipeline:
    name: "Execute Advanced Android Compilation Process"
    runs-on: ubuntu-latest
    
    steps:
    - name: "Step 1: Download Repository Source Code"
      uses: actions/checkout@v4

    - name: "Step 2: Extract Zip File safely"
      run: |
        unzip -q TvLauncher.zip -d target_extraction_directory
        rm -rf target_extraction_directory/__MACOSX
        ROOT_DETECTED_DIR=$(find target_extraction_directory -name "build.gradle*" -exec dirname {} \; | head -n 1)
        echo "PROJECT_ABS_PATH=$ROOT_DETECTED_DIR" >> $GITHUB_ENV

    # Testando com Java 11 que resolve 90% dos erros de projetos antigos de TV
    - name: "Step 3: Setup Java JDK 11 (Compatibility Mode)"
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: "Step 4: Grant Permissions"
      run: |
        cd ${{ env.PROJECT_ABS_PATH }}
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew 2>/dev/null || true

    - name: "Step 5: Run Automated Gradle Build"
      run: |
        cd ${{ env.PROJECT_ABS_PATH }}
        
        # Ignora avisos de pacotes obsoletos e força a compilação limpa
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --no-daemon -Xmx4g || ./gradlew assembleDebug --no-daemon -Xmx4g --warning-mode none
        else
          gradle assembleDebug --no-daemon -Xmx4g || gradle assembleDebug --no-daemon -Xmx4g --warning-mode none
        fi

    - name: "Step 6: Export Finished APK"
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: "Jeff-TvLauncher-Official-APK"
        path: '**/build/outputs/apk/debug/*.apk'
