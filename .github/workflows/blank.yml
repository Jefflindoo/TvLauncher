name: Generate Perfect APK

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Extract Project Files
      run: |
        unzip TvLauncher.zip -d extracted_root
        PROJECT_DIR=$(find extracted_root -name "build.gradle*" -exec dirname {} \; | head -n 1)
        echo "PROJECT_PATH=$PROJECT_DIR" >> $GITHUB_ENV
        echo "Successfully located Android project root at: $PROJECT_DIR"
      
    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Android APK
      run: |
        cd ${{ env.PROJECT_PATH }}
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew 2>/dev/null || true
        
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          gradle assembleDebug --no-daemon --stacktrace
        fi
      
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: Finished-APK-Download
        path: '**/build/outputs/apk/debug/*.apk'
